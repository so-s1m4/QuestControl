map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  server_name _;
  underscores_in_headers on;
  client_max_body_size 10m;
  # Compose recreates service containers during an image update. Resolve their
  # names through Docker DNS at request time instead of retaining the old IP
  # until this gateway itself is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream quest-control-api:3000;
  set $web_upstream quest-control-web:80;
  # Legacy CRM endpoints are mounted without /api in Express, while the AI
  # modules are mounted with it. Preserve the prefix only for the latter.
  # Both paths still resolve through Docker DNS at request time.
  location ~ ^/api/(ai|activity)/ { proxy_pass http://$api_upstream$request_uri; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  # A variable proxy_pass cannot perform Nginx's normal prefix stripping.
  # Capture the suffix explicitly, so /api/auth/login reaches /auth/login.
  location ~ ^/api/(.*)$ { proxy_pass http://$api_upstream/$1$is_args$args; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location = /api/vr/sankt-poelten/vnc {
    proxy_pass http://$api_upstream/vr/sankt-poelten/vnc$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }
  location /socket.io/ { proxy_pass http://$api_upstream; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
  location /agent { proxy_pass http://$api_upstream; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
  location /webadmin/v1/ {
    proxy_pass http://$api_upstream/vr/sankt-poelten/proxy/webadmin/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /content/79/ {
    proxy_pass http://$api_upstream/vr/sankt-poelten/proxy/content/79/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /content/ {
    proxy_pass http://$api_upstream/vr/sankt-poelten/proxy/content/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  # auth_request subrequests do not preserve arbitrary query parameters. Pass
  # the original player URL to the API in a trusted proxy header instead.
  location = /_camera_stream_authorize {
    internal;
    proxy_pass http://$api_upstream/camera-stream/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }
  location = /go2rtc/stream.html {
    # The video player is loaded inside an iframe, so it cannot forward the
    # app's Authorization header. The API issues a short-lived ticket after it
    # has checked the user's camera permissions; validate it on every player
    # page request.
    auth_request /_camera_stream_authorize;
    proxy_pass http://host.docker.internal:1984/stream.html;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # The upstream player constructs its WebSocket URL in JavaScript. Carry
    # the already-authorized ticket through to that WebSocket request too.
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter "api/ws?src=" "api/ws?ticket=$arg_ticket&src=";
  }
  location = /go2rtc/video-stream.js { proxy_pass http://host.docker.internal:1984/video-stream.js; }
  location = /go2rtc/video-rtc.js { proxy_pass http://host.docker.internal:1984/video-rtc.js; }
  location = /go2rtc/api/ws {
    auth_request /_camera_stream_authorize;
    proxy_pass http://host.docker.internal:1984/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # go2rtc rejects cross-origin WebSocket handshakes. The browser connects
    # through this reverse proxy, so present the upstream origin consistently.
    proxy_set_header Host 127.0.0.1:1984;
    proxy_set_header Origin http://127.0.0.1:1984;
  }
  location / { proxy_pass http://$web_upstream; proxy_set_header Host $host; }
}

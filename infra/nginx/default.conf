map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  server_name _;
  client_max_body_size 10m;
  location /api/ { proxy_pass http://quest-control-api:3000/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /socket.io/ { proxy_pass http://quest-control-api:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
  location /agent { proxy_pass http://quest-control-api:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
  location /webadmin/v1/ {
    proxy_pass http://quest-control-api:3000/vr/sankt-poelten/proxy/webadmin/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location = /go2rtc/stream.html {
    proxy_pass http://host.docker.internal:1984/stream.html;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }
  location = /go2rtc/video-rtc.js { proxy_pass http://host.docker.internal:1984/video-rtc.js; }
  location = /go2rtc/api/ws {
    proxy_pass http://host.docker.internal:1984/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location / { proxy_pass http://quest-control-web:80; proxy_set_header Host $host; }
}

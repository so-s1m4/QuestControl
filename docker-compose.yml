name: quest-control
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quest_control}
      POSTGRES_USER: ${POSTGRES_USER:-quest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data, ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me}
    volumes: [redis_data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me}", "ping"], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      AI_SERVICE_URL: http://ai-service:8088
    volumes:
      - ./infra/postgres/migrations:/app/migrations:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      default:
        aliases: [quest-control-api]
      document-sandbox:
    restart: unless-stopped
  migrate:
    build: ./apps/api
    command: ["node", "-e", "import('./src/migrator.js').then(m => m.runCli())"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./infra/postgres/migrations:/app/migrations:ro
    restart: "no"
    profiles: [tools, migrate]
  ai-service:
    build: ./apps/ai-service
    env_file: .env
    environment:
      PORT: 8088
      YOLO_MODEL: /app/models/yolo11n.pt
      HEADSET_MODEL: ${HEADSET_MODEL:-/app/models/current/vr_headset_yolo.pt}
      HEADSET_MODEL_METADATA: ${HEADSET_MODEL_METADATA:-/app/models/current/model_metadata.json}
      HEADSET_CONFIDENCE_THRESHOLD: ${HEADSET_CONFIDENCE_THRESHOLD:-0.85}
      VLM_MODEL: moondream2
      VLM_ENDPOINT: ${VLM_ENDPOINT:-http://vlm:11434}
      API_INTERNAL_URL: http://api:3000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      TUYA_AI_HLS_FALLBACK: ${TUYA_AI_HLS_FALLBACK:-true}
      TUYA_AI_STREAM_TYPE: ${TUYA_AI_STREAM_TYPE:-2}
    volumes:
      - ai_data:/app/data
      - ai_dataset:/app/dataset
      - ai_models:/app/models
    networks: [default]
    restart: unless-stopped
  vlm:
    image: ollama/ollama:latest
    container_name: quest-vlm
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
  vlm-init:
    image: curlimages/curl:latest
    depends_on:
      - vlm
    restart: "no"
    command: >
      sh -c "
        echo 'Waiting for Ollama to become ready...';
        until curl -s http://vlm:11434/api/tags > /dev/null; do
          sleep 2;
        done;
        echo 'Pulling Moondream VLM model...';
        curl -X POST http://vlm:11434/api/pull -d '{\"name\": \"moondream\"}';
        echo 'Moondream model pull completed.';
      "
  document-runner:
    build: ./apps/document-runner
    read_only: true
    tmpfs: ["/tmp:size=64M,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 384m
    networks: [document-sandbox]
    restart: unless-stopped
  web:
    build: ./apps/web
    depends_on: [api]
    networks:
      default:
        aliases: [quest-control-web]
    restart: unless-stopped
  go2rtc:
    image: alexxit/go2rtc:latest
    network_mode: host
    volumes: [./infra/go2rtc.yaml:/config/go2rtc.yaml:ro]
    profiles: [cameras]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes: [./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro, ./certbot:/etc/letsencrypt:ro]
    depends_on: [api, web]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
volumes: { postgres_data: {}, redis_data: {}, ollama_data: {}, ai_data: {}, ai_dataset: {}, ai_models: {} }
networks:
  document-sandbox:
    internal: true

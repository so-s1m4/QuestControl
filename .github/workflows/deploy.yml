name: Build and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.names.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image owner
        id: names
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-api:latest
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-web:latest
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - uses: docker/build-push-action@v6
        with:
          context: infra/postgres
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-postgres:latest
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-postgres:${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - uses: docker/build-push-action@v6
        with:
          context: infra/nginx
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-gateway:latest
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-gateway:${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Ask Portainer to pull and redeploy
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          test -n "$PORTAINER_WEBHOOK_URL"
          curl --fail --silent --show-error \
            --request POST \
            --retry 3 \
            --max-time 120 \
            "$PORTAINER_WEBHOOK_URL"

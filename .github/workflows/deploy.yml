name: Build and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.names.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image owner
        id: names
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-api:latest
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-web:latest
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - uses: docker/build-push-action@v6
        with:
          context: infra/postgres
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-postgres:latest
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-postgres:${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - uses: docker/build-push-action@v6
        with:
          context: infra/nginx
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-gateway:latest
            ghcr.io/${{ steps.names.outputs.owner }}/quest-control-gateway:${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ask Portainer to redeploy
        env:
          OVH_HOST: ${{ secrets.OVH_HOST }}
          OVH_USER: ${{ secrets.OVH_USER }}
          OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT }}
        run: |
          ssh -p "${OVH_SSH_PORT:-22}" \
            "$OVH_USER@$OVH_HOST" \
            /opt/quest-control/portainer-redeploy.sh

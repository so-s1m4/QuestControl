name: quest-control

services:
  postgres:
    image: ${REGISTRY_IMAGE_PREFIX}/quest-control-postgres:${IMAGE_TAG:-latest}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    image: ${REGISTRY_IMAGE_PREFIX}/quest-control-postgres:${IMAGE_TAG:-latest}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for migration in /migrations/*.sql; do
          echo "Applying $${migration}"
          psql --set ON_ERROR_STOP=1 --host postgres --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}" --file "$${migration}"
        done
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  api:
    image: ${REGISTRY_IMAGE_PREFIX}/quest-control-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PSEUDONYMIZATION_SECRET: ${PSEUDONYMIZATION_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      PUBLIC_URL: ${PUBLIC_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TRUST_PROXY: "1"
      TUYA_BASE_URL: ${TUYA_BASE_URL:-https://openapi.tuyaeu.com}
      TUYA_MESSAGE_URL: ${TUYA_MESSAGE_URL:-wss://mqe.tuyaeu.com:8285/}
      TUYA_CLIENT_ID: ${TUYA_CLIENT_ID}
      TUYA_CLIENT_SECRET: ${TUYA_CLIENT_SECRET}
      TIME_TO_GROW_BASE_URL: ${TIME_TO_GROW_BASE_URL:-https://api.time-to-grow.com}
      TIME_TO_GROW_CLUB_ID: ${TIME_TO_GROW_CLUB_ID}
      TIME_TO_GROW_VIENNA_CLUB_ID: ${TIME_TO_GROW_VIENNA_CLUB_ID:-01js42s5vwvwrx3fme9zvgdj1v}
      TIME_TO_GROW_JWT: ${TIME_TO_GROW_JWT}
      TIME_TO_GROW_EMAIL: ${TIME_TO_GROW_EMAIL}
      TIME_TO_GROW_PASSWORD: ${TIME_TO_GROW_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      VR_SANKT_POELTEN_PANEL_URL: ${VR_SANKT_POELTEN_PANEL_URL:-http://172.23.0.1:30000}
      VR_SANKT_POELTEN_DEVICE_URL: ${VR_SANKT_POELTEN_DEVICE_URL:-http://172.23.0.1:6101}
      VR_SANKT_POELTEN_SOCKS_URL: ${VR_SANKT_POELTEN_SOCKS_URL:-socks5h://172.23.0.1:1080}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      DOCUMENT_RUNNER_URL: http://document-runner:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      AI_SERVICE_URL: http://ai-service:8088
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      document-runner:
        condition: service_started
    networks:
      default:
        aliases:
          - quest-control-api
      document-sandbox:
    restart: unless-stopped

  document-runner:
    image: ${REGISTRY_IMAGE_PREFIX}/quest-control-document-runner:${IMAGE_TAG:-latest}
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 384m
    networks:
      - document-sandbox
    restart: unless-stopped

  web:
    image: ${REGISTRY_IMAGE_PREFIX}/quest-control-web:${IMAGE_TAG:-latest}
    depends_on:
      - api
    networks:
      default:
        aliases:
          - quest-control-web
    restart: unless-stopped

  ai-service:
    image: ${REGISTRY_IMAGE_PREFIX}/quest-control-ai-service:${IMAGE_TAG:-latest}
    environment:
      PORT: "8088"
      NODE_ENV: production
      YOLO_MODEL: /app/models/yolo11n.pt
      HEADSET_MODEL: ${HEADSET_MODEL:-/app/models/current/vr_headset_yolo.pt}
      HEADSET_MODEL_METADATA: ${HEADSET_MODEL_METADATA:-/app/models/current/model_metadata.json}
      HEADSET_CONFIDENCE_THRESHOLD: ${HEADSET_CONFIDENCE_THRESHOLD:-0.85}
      VLM_MODEL: moondream2
      VLM_ENDPOINT: http://vlm:11434
      API_INTERNAL_URL: http://api:3000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      TUYA_AI_HLS_FALLBACK: ${TUYA_AI_HLS_FALLBACK:-true}
      TUYA_AI_STREAM_TYPE: ${TUYA_AI_STREAM_TYPE:-2}
    volumes:
      - ai_data:/app/data
      - ai_dataset:/app/dataset
      - ai_models:/app/models
    depends_on:
      api:
        condition: service_started
    networks:
      default:
        aliases:
          - quest-control-ai-service
    restart: unless-stopped

  vlm:
    image: ollama/ollama:latest
    container_name: quest-vlm
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      default:
        aliases:
          - quest-control-vlm
    restart: unless-stopped

  vlm-init:
    image: curlimages/curl:latest
    depends_on:
      - vlm
    restart: "no"
    command: >
      sh -c "
        echo 'Waiting for Ollama to become ready...';
        until curl -s http://vlm:11434/api/tags > /dev/null; do
          sleep 2;
        done;
        echo 'Pulling Moondream VLM model...';
        curl -X POST http://vlm:11434/api/pull -d '{\"name\": \"moondream\"}';
        echo 'Moondream model pull completed.';
      "

  nginx:
    image: ${REGISTRY_IMAGE_PREFIX}/quest-control-gateway:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${HTTP_PORT:-10080}:80"
      - "127.0.0.1:${HTTPS_PORT:-10443}:443"
    volumes:
      - certbot_data:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      default:
      proxy:
        aliases:
          - quest-control
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  certbot_data:
  ollama_data:
  ai_data:
  ai_dataset:
  ai_models:

networks:
  document-sandbox:
    internal: true
  proxy:
    external: true
